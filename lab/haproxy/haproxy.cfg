# Un frontend (puerto) por cada idea de la presentación, todos contra las mismas 3 apps.
# Cambiá algo y aplicalo con: docker compose restart lb

global
    log stdout format raw local0 info

# Usa el DNS de Docker: si un contenedor se recrea con otra IP, HAProxy la encuentra.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s

defaults
    mode http
    log global
    option httplog
    timeout connect 2s
    timeout client 30s
    # Si una app no contesta en 10 s, el LB corta y responde 504.
    timeout server 10s
    # Si la conexión a un servidor falla, reintenta en otro.
    retries 2
    option redispatch
    # Health checks activos: GET /health cada 2 s; 2 fallas lo sacan, 2 éxitos lo vuelven a meter.
    option httpchk GET /health
    default-server check inter 2s fall 2 rise 2 resolvers docker init-addr last,libc,none
    # Capa 7: el LB lee HTTP, así que puede agregar headers.
    option forwardfor
    log-format "%ci → %f → %s  %ST  %Tt ms  %r"

# ---------- Algoritmos ----------

frontend round_robin
    bind :8080
    http-request set-header X-Balanceador round-robin
    default_backend apps_round_robin

backend apps_round_robin
    balance roundrobin
    server app1 app1:3000
    server app2 app2:3000
    server app3 app3:3000

frontend least_connections
    bind :8081
    http-request set-header X-Balanceador least-connections
    default_backend apps_least_conn

backend apps_least_conn
    balance leastconn
    server app1 app1:3000
    server app2 app2:3000
    server app3 app3:3000

frontend ip_hash
    bind :8082
    http-request set-header X-Balanceador ip-hash
    default_backend apps_ip_hash

backend apps_ip_hash
    balance source
    hash-type consistent
    server app1 app1:3000
    server app2 app2:3000
    server app3 app3:3000

frontend weighted
    bind :8083
    http-request set-header X-Balanceador weighted
    default_backend apps_weighted

backend apps_weighted
    balance roundrobin
    server app1 app1:3000 weight 3
    server app2 app2:3000 weight 1
    server app3 app3:3000 weight 1

# ---------- Sesiones ----------

frontend sticky
    bind :8084
    http-request set-header X-Balanceador sticky
    default_backend apps_sticky

backend apps_sticky
    balance roundrobin
    # El LB agrega una cookie con el servidor elegido y la respeta en los pedidos siguientes.
    cookie LB_SERVIDOR insert indirect nocache
    server app1 app1:3000 cookie app1
    server app2 app2:3000 cookie app2
    server app3 app3:3000 cookie app3

# ---------- Capa 4 ----------

frontend capa4
    bind :8085
    mode tcp
    option tcplog
    log-format "%ci → %f → %s  (TCP, %B bytes)"
    default_backend apps_capa4

backend apps_capa4
    mode tcp
    balance roundrobin
    # En capa 4 el health check sólo prueba que el puerto acepte conexiones.
    option tcp-check
    server app1 app1:3000
    server app2 app2:3000
    server app3 app3:3000

# ---------- Panel ----------

frontend stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 2s
    stats show-legends
